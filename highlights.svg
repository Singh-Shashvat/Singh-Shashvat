<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="150">
  <defs>
    <!-- Background -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
  </defs>

  <!-- ========================================================= -->
  <!-- MAIN CARD -->
  <!-- ========================================================= -->

  <rect
    x="2"
    y="2"
    width="846"
    height="146"
    rx="18"
    fill="url(#bentoBg)"
    stroke="#00f0ff"
    stroke-opacity="0.4"
    stroke-width="1.5"
  />

  <!-- ========================================================= -->
  <!-- TITLE -->
  <!-- ========================================================= -->

  <text
    x="24"
    y="32"
    font-family="monospace"
    font-size="11"
    font-weight="800"
    letter-spacing="1.5"
    fill="#00f0ff"
  >
    HIGHLIGHTS
  </text>

  <!-- ========================================================= -->
  <!-- SUBCARDS -->
  <!-- ========================================================= -->

  <g transform="translate(20, 46)">

    <!-- Full-Stack Engineering -->
    <g transform="translate(0, 0)">
      <rect
        width="260"
        height="80"
        rx="12"
        fill="#0e1222"
        stroke="#00f0ff"
        stroke-opacity="0.4"
        stroke-width="1"
      />

      <text
        x="18"
        y="36"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="800"
        fill="#00f0ff"
      >
        Full-Stack Engineering
      </text>

      <text
        x="18"
        y="58"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#818cf8"
      >
        Building resilient modern web systems &amp; services
      </text>
    </g>

    <!-- Open-Source Tooling -->
    <g transform="translate(272, 0)">
      <rect
        width="260"
        height="80"
        rx="12"
        fill="#0e1222"
        stroke="#00f0ff"
        stroke-opacity="0.4"
        stroke-width="1"
      />

      <text
        x="18"
        y="36"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="800"
        fill="#ffffff"
      >
        Open-Source Tooling
      </text>

      <text
        x="18"
        y="58"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#818cf8"
      >
        Developer experience, performance, and automation
      </text>
    </g>

    <!-- Cloud & System Design -->
    <g transform="translate(544, 0)">
      <rect
        width="260"
        height="80"
        rx="12"
        fill="#0e1222"
        stroke="#00f0ff"
        stroke-opacity="0.4"
        stroke-width="1"
      />

      <text
        x="18"
        y="36"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="800"
        fill="#ffffff"
      >
        Cloud &amp; System Design
      </text>

      <text
        x="18"
        y="58"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#818cf8"
      >
        Scalable cloud infrastructure &amp; APIs
      </text>
    </g>

  </g>

</svg>
